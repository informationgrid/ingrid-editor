services:

  editor:
    image: docker-registry.wemove.com/ingrid-ige-ng
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - TZ=Europe/Berlin
      - _JAVA_OPTIONS=-Xmx2g -Dstorage.diskCache.bufferSize=256 -Dspring.profiles.active=elasticsearch,mcloud,test,uvp,ingrid,ingrid-kommunal-st,ingrid-krzn,ingrid-up-sh,ogc-api,csw-t,ogc-distributions-api,ingrid-bast,codelist-repo
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8699
      - KEYCLOAK_URL=http://${SERVICE_FQDN_KEYCLOAK}/keycloak
      - KEYCLOAK_BACKEND_USER=ige
      - KEYCLOAK_BACKEND_USER_PASSWORD=ige
      - DATABASE_HOST=db
      - WAIT_FOR_PARAM=keycloak:8080
      - WAIT_FOR_PARAM_TIMEOUT=300
      - SHOW_SWAGGER_UI=true
    labels:
      - 'traefik.http.services.editor.loadbalancer.server.port=80'
    networks:
      - ige-ng-network

  keycloak:
    image: docker-registry.wemove.com/keycloak:26.2.4-1
    restart: unless-stopped
    environment:
      - SIMPLE_SECURITY=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://${SERVICE_FQDN_KEYCLOAK}/keycloak
      - KC_HTTP_ENABLED=true
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=admin
      - MAIL_SMTP=mailrelay
      - MAIL_FROM=keycloak@wemove.com
      - IGE_FRONTEND_URL=http://${SERVICE_FQDN_KEYCLOAK}
      - IGE_SUPER_USER_LOGIN=ige
      - IGE_SUPER_USER_PASSWORD=ige
      - IGE_SUPER_USER_FIRSTNAME=Super
      - IGE_SUPER_USER_LASTNAME=User
      - IGE_SUPER_USER_EMAIL=super@user.test
    networks:
      - ige-ng-network

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      - cluster.name=ingrid
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - http.cors.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    restart: unless-stopped
    # volumes:
      # - ./set-keystore-password.sh:/usr/share/elasticsearch/bin/set-keystore-password.sh
      # - ./elasticsearch-ssl-http/elasticsearch/http.p12:/usr/share/elasticsearch/config/http.p12
    # entrypoint: [ "/bin/bash", "-c", "/usr/share/elasticsearch/bin/set-keystore-password.sh && /usr/local/bin/docker-entrypoint.sh eswrapper" ]
    networks:
      - ige-ng-network

  db:
    image: "postgres"
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/cache
      - /pgdata
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /pgdata
    networks:
      - ige-ng-network

  adminer:
    image: adminer
    restart: unless-stopped
    networks:
      - ige-ng-network

networks:
  ige-ng-network:
    driver: "bridge"
