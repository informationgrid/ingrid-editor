    implementation "org.commonmark:commonmark-ext-yaml-front-matter:0.24.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.24.0"

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // PostgreSQL
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation "org.hibernate.orm:hibernate-core"
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.5'

    implementation "de.ingrid:ingrid-codelist-service:7.6.0-SNAPSHOT"
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.commons:commons-text:1.13.0'

