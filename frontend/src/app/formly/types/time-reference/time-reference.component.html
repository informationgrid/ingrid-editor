<div class="flex-row gap-24">
    <div class="flex-col gap-12 flex-1">
        <div>Von</div>
        <mat-divider></mat-divider>
        <mat-radio-group class="flex-col">
            <mat-radio-button value="1" class="no-wrap">
                Datum
                <mat-form-field
                    appearance="outline"
                    class="date-box width-date-small"
                    data-cy="datepicker-timeref-from"
                >
                    <input matInput [matDatepicker]="picker_from" />
                    <mat-datepicker-toggle
                        matSuffix
                        [for]="picker_from"
                    ></mat-datepicker-toggle>
                    <mat-datepicker #picker_from></mat-datepicker>
                </mat-form-field>

                @if (showTimepicker()) {
                    <mat-form-field
                        appearance="outline"
                        class="date-box width-time-small"
                        data-cy="timepicker-timeref-from"
                    >
                        <input matInput [matTimepicker]="timepicker_from" />
                        <mat-timepicker-toggle
                            matIconSuffix
                            [for]="timepicker_from"
                        />
                        <mat-timepicker #timepicker_from />
                    </mat-form-field>
                }
            </mat-radio-button>
            <mat-radio-button value="2">
                Nicht vorhanden/Unbekannt
            </mat-radio-button>
        </mat-radio-group>
    </div>
    <div class="flex-col gap-12 flex-1">
        <div>Bis</div>
        <mat-divider></mat-divider>
        <mat-radio-group class="flex-col">
            <mat-radio-button value="1" class="no-wrap">
                Datum
                <mat-form-field
                    appearance="outline"
                    class="date-box width-date-small"
                    data-cy="datepicker-timeref-to"
                >
                    <input matInput [matDatepicker]="picker_to" />
                    <mat-datepicker-toggle
                        matSuffix
                        [for]="picker_to"
                    ></mat-datepicker-toggle>
                    <mat-datepicker #picker_to></mat-datepicker>
                </mat-form-field>

                @if (showTimepicker()) {
                    <mat-form-field
                        appearance="outline"
                        class="date-box width-time-small"
                        data-cy="timepicker-timeref-to"
                    >
                        <input matInput [matTimepicker]="timepicker_to" />
                        <mat-timepicker-toggle
                            matIconSuffix
                            [for]="timepicker_to"
                        />
                        <mat-timepicker #timepicker_to />
                    </mat-form-field>
                }
            </mat-radio-button>
            <mat-radio-button value="2">
                Fortlaufend, aktuell
            </mat-radio-button>
            <mat-radio-button value="2">
                Nicht vorhanden/Unbekannt
            </mat-radio-button>
        </mat-radio-group>
    </div>
</div>
