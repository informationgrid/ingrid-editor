<mat-radio-group [(ngModel)]="selectedValue" aria-label="Option auswählen">
    @for (option of radioOptions; track option.key) {
        <mat-radio-button
            (click)="selectOption(option)"
            color="primary"
            value="{{ option.key }}"
        >
            {{ option.title }}
        </mat-radio-button>
    }
</mat-radio-group>
