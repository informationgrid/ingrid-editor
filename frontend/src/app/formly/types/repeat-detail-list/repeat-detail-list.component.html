@if (showError && formControl.invalid && formControl.errors) {
    <ige-form-error>
        <formly-validation-message [field]="field"></formly-validation-message>
    </ige-form-error>
}
@if (model[field.key + ""]?.length) {
    <mat-list
        cdkDropList
        cdkDropListOrientation="vertical"
        (cdkDropListDropped)="drop($event)"
    >
        @for (item of this.previewItems(); track item; let index = $index) {
            <mat-list-item
                cdkDrag
                [cdkDragDisabled]="formControl.disabled"
                [class.clickable]="formControl.enabled"
                [class.draggable]="formControl.enabled"
            >
                <div class="flex-row gap-6">
                    @if (formControl.enabled) {
                        <mat-icon cdkDragHandle matTooltip="Sortieren"
                            >drag_indicator
                        </mat-icon>
                    }
                    <div class="flex-1 flex-col align-items-start">
                        <ng-container
                            *ngComponentOutlet="
                                props.viewComponent;
                                inputs: { item }
                            "
                        />
                    </div>
                    @if (formControl.enabled) {
                        <button
                            mat-icon-button
                            type="button"
                            class="menu-button"
                            matTooltip="Bearbeiten"
                            [matMenuTriggerFor]="menu"
                        >
                            <mat-icon svgIcon="Mehr"></mat-icon>
                        </button>
                    }
                    <mat-menu #menu>
                        <button mat-menu-item (click)="editItem(index)">
                            Bearbeiten
                        </button>
                        <button mat-menu-item (click)="removeItem(index)">
                            Entfernen
                        </button>
                    </mat-menu>
                </div>
            </mat-list-item>
        }
    </mat-list>
}

@if (formControl.enabled) {
    <ige-add-button
        (add)="addItem($event)"
        [options]="props._types"
        [showRequiredError]="
            showError && formControl.invalid && formControl.errors?.required
        "
    ></ige-add-button>
}
