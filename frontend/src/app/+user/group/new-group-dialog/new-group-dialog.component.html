<div cdkDrag cdkDragRootElement=".cdk-overlay-pane">
    <div
        cdkDragHandle
        class="dialog-title-wrapper flex-row align-items-center gap-12"
    >
        <button
            data-cy="dlg-close"
            mat-icon-button
            mat-dialog-close
            aria-label="Dialog schließen"
        >
            <mat-icon>close</mat-icon>
        </button>
        <h1 mat-dialog-title>Gruppe hinzufügen</h1>
    </div>

    <mat-dialog-content [formGroup]="form">
        <mat-form-field appearance="outline" class="width-100">
            <mat-label>Gruppenname</mat-label>
            <input
                matInput
                data-cy="input-group-name"
                [igeFocus]="true"
                placeholder="Eingeben..."
                (keyup.enter)="createGroup()"
                formControlName="name"
            />
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button data-cy="cancel" mat-button mat-dialog-close color="primary">
            Abbrechen
        </button>
        <div class="flex-1"></div>
        <button
            data-cy="form-dialog-confirm"
            mat-flat-button
            color="primary"
            [disabled]="form.invalid"
            (click)="createGroup()"
        >
            Anlegen
        </button>
    </mat-dialog-actions>
</div>
