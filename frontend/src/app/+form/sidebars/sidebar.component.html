<ige-tree
    [showReloadButton]="true"
    [showWriteAccessToggle]="showWriteAccessToggle()"
    [update]="updateTree"
    [setActiveNode]="activeTreeNode"
    [forAddresses]="address()"
    [enableDrag]="true"
    [showMultiSelectButton]="true"
    (dropped)="dropped.emit($event)"
    (activate)="handleLoad($event)"
    (multiEditMode)="updateTreeMode($event)"
    (selected)="handleSelection($event)"
></ige-tree>
