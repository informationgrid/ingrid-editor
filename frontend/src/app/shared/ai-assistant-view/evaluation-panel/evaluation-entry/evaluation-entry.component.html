<div class="text-box">
    <div
        class="flex-row gap-8 align-items-center justify-content-space-between font-medium"
    >
        <div class="flex-1">{{ evaluation().name }}</div>
        <ige-score-indicator [score]="evaluation().score" />
    </div>

    @if (evaluation().reason) {
        <div class="text-sm">{{ evaluation().reason }}</div>
    }
</div>

@if (evaluation().options && evaluation().options.length) {
    <mat-divider></mat-divider>

    <ige-ai-suggestion-list
        [options]="evaluation().options"
        [key]="evaluation().key"
        [expanded]="isExpanded()"
        [(selected)]="selectedOption"
    />

    <div class="action-box">
        @if (evaluation().options.length > 1) {
            <button matButton="outlined" (click)="toggleIsExpanded()">
                {{ isExpanded() ? "Weniger" : "Mehr" }}
            </button>
        }

        <div class="flex-row gap-8">
            <button class="flex-1" matButton="outlined" (click)="reset()">
                Zurücksetzen
            </button>

            <button
                class="flex-1"
                matButton="outlined"
                [disabled]="!selectedOption()"
                (click)="apply(selectedOption())"
            >
                Übernehmen
            </button>
        </div>
    </div>
}
