<div class="flex-col gap-8">
    <div class="flex-row gap-8 justify-content-space-between font-medium">
        <span>{{ evaluation().label }}</span>
        <span class="score"> {{ evaluation().score }} / 10 </span>
    </div>

    <div class="text-sm">{{ evaluation().reasoning }}</div>

    <mat-selection-list [multiple]="false" #suggestionList>
        @for (suggestion of evaluation().suggestions; track suggestion) {
            <mat-list-option class="no-wrap" [value]="suggestion">
                {{ suggestion }}
            </mat-list-option>
        }
    </mat-selection-list>

    <button
        matButton="outlined"
        class="align-self-end"
        [disabled]="!suggestionList.selectedOptions.selected.length"
        (click)="apply(suggestionList.selectedOptions.selected[0].value)"
    >
        Übernehmen
    </button>
</div>
