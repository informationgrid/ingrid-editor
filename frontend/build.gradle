/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
  id 'base'
  id "com.github.node-gradle.node" version "7.0.2"
}

repositories {
  maven {
    url = 'https://nexus.informationgrid.eu/repository/maven-public'
  }
}

group = 'de.ingrid'
description = 'IGE-NG Frontend'

node {
  version = '22.16.0'
  download = true
}

def buildArgs = ['run', 'prod']
if (hasProperty('baseHref')) {
  buildArgs = ['run', 'prod', '--base-href', getProperty('baseHref')]
}

tasks.register('yarnUpgrade', YarnTask) {
  dependsOn 'yarnSetup'
  args = ['set', 'version', '4.6.0']     // maybe with `yarn set version 3.x` also
}

tasks.register('yarnInstall', YarnTask) {
  dependsOn 'yarnUpgrade'
  args = ['install', '--immutable']
}

tasks.register('bundle', YarnTask) {
  dependsOn 'yarnInstall'
  inputs.dir(fileTree("node_modules").exclude(".cache"))
  inputs.dir('src')
  inputs.files('package.json', 'package-lock.json', 'angular.json', 'tsconfig.json', 'tsconfig.app.json')

  outputs.dir('build/dist/browser')

  args = buildArgs
}

tasks.register('test', YarnTask) {
  args = ['run', 'test-ci']
}

tasks.register('testFormatting', YarnTask) {
  args = ['prettier', '--check', "."]
}

tasks.register('prepareFrontendDist', Sync) {
  dependsOn bundle

  duplicatesStrategy = DuplicatesStrategy.INCLUDE
  from('build/dist/browser')

  from('src/assets') {
    include 'config.prod.json'
    rename { 'config.json' }
    into 'assets'
  }

  into layout.buildDirectory.dir("frontend-dist")
}

assemble.dependsOn(prepareFrontendDist)

configurations {
  frontendExport {
    canBeConsumed = true
    canBeResolved = false
  }
}
configurations.default.extendsFrom(configurations.frontendExport)

if (hasProperty('buildProfile')) {
  def frontendDistTask = tasks.named('prepareFrontendDist', Sync)
  artifacts {
    frontendExport(layout.buildDirectory.dir("frontend-dist")) {
      builtBy(frontendDistTask)
    }
  }
}

clean {
  // do nothing to improve speed
  // delete packageNpmApp.archivePath
  delete "./target"
}

spotless {
  typescript {
    target 'src/**/*.ts'
    licenseHeaderFile(file('../LICENSE'), '(import|const|declare|export|var) ').updateYearWithLatest(true)
  }
}
