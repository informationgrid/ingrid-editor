description:
  de:
    screenshots: []
    features:
      - Erfassung, Validierung und Veröffentlichung von ISO 19115/19119, OGC und INSPIRE konformen Metadaten.
      - Einfache Import- und Exportfunktionalität für verschiedene Metadatenformate.
      - Unterstützung verschiedener Profile wie opendata, UVP und InGrid.
      - Integration mit Keycloak für eine zentrale Authentifizierung.
      - Rollenbasierte Nutzerverwaltung und granulare Berechtigungen für Kataloge und Dokumente.
      - Modernes, responsives Web-Interface auf Basis von Angular.
      - Unterstützung für aktuelle Standards wie die OGC API for Records.
    longDescription: >
      Der InGrid Editor ist eine zentrale Komponente der [InGrid-Softwarefamilie](https://opencode.de/de/software/in-grid-10691),
      einer leistungsfähigen und flexiblen Softwarelösung für die Erfassung, Verwaltung
      und Bereitstellung von Daten und Metadaten, entwickelt und permanent gepflegt im
      Rahmen einer Bund-Länder-Verwaltungskooperation.


      Der InGrid-Editor ermöglicht die Erfassung, Pflege, Validierung und Veröffentlichung von Metadaten
      über flexible Formulare und bietet einen umfangreichen Workflow, der den Import sowie den Export
      verschiedener Formate erlaubt. Insbesondere wird die Erfassung und Publikation von ISO 19115/19119-,
      OGC-, INSPIRE- und DCAT-AP.DE-konformen Metadaten unterstützt. Durch eine modulare Architektur können verschiedene
      fachliche Profile (wie z.B. Opendata, INSPIRE, HVD oder UVP) integriert werden, um spezifische Anforderungen
      an die Datenerfassung zu erfüllen.


      Wichtige Funktionen sind:

      - Webbasierte Benutzeroberfläche für die Metadatenerfassung und -pflege

      - Assistenten für die Metadatenerfassung
      
      - Validierungstools
      
      - Flexibles Rollen- und Rechte-Modell

      - Integration in bestehende Infrastrukturen via Keycloak
      
      Weiterführende Links:

      - [Dokumentation](https://ingrid-oss.eu/latest/components/editor/)
      - [Infos zum Projekt](https://ingrid-oss.eu/latest/contributing/organisation/)
      - [Projektpartner](https://ingrid-oss.eu/latest/contributing/partner/)
    shortDescription: >
      Zentrale Komponente zur Pflege von ISO 19115/19119, OGC-, INSPIRE- und
      DCAT-AP.DE-konformen Metadaten innerhalb der InGrid-Plattform.
    genericName: Metadaten-Editor

